name: Publish BentCrypto MCP

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PUBLISH to publish bentcrypto-mcp to npm and the official MCP Registry"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ inputs.confirmation == 'PUBLISH' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate package
        run: |
          npm run check
          npm test
          npm audit --omit=dev --audit-level=high
          npm run pack:check

      - name: Require npm publishing token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured in this repository. Add a granular npm automation token as the NPM_TOKEN Actions secret, then re-run this workflow."
            exit 1
          fi

      - name: Publish bentcrypto-mcp to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Install official MCP Registry publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate official MCP Registry metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate to official MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata to official MCP Registry
        run: ./mcp-publisher publish server.json
