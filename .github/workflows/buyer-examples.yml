name: Buyer Examples

on:
  pull_request:
    paths:
      - 'javascript/**'
      - 'python/**'
      - 'docs/**'
      - 'examples/**'
      - 'package.json'
      - 'requirements.txt'
      - '.github/workflows/buyer-examples.yml'

permissions:
  contents: read

jobs:
  node-base-buyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node --check javascript/token-risk-base.js
      - name: Verify x402 EVM client exports
        run: node --input-type=module -e "import('@x402/core/client').then(async c => { const e = await import('@x402/evm/exact/client'); const v = await import('viem/accounts'); if (!c.x402Client || !c.x402HTTPClient || !e.ExactEvmScheme || !v.privateKeyToAccount) process.exit(1); console.log('PASS Base JavaScript buyer dependencies import'); })"
      - name: Validate current Base challenge without paying
        run: npm run token-risk:base:challenge

  python-base-buyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile python/token_risk_base.py
      - name: Verify x402 EVM imports
        run: python -c "from eth_account import Account; from x402 import x402Client; from x402.http.clients import x402HttpxClient; from x402.mechanisms.evm import EthAccountSigner; from x402.mechanisms.evm.exact.register import register_exact_evm_client; print('PASS Base Python buyer dependencies import')"
      - name: Validate current Base challenge without paying
        env:
          BENTCRYPTO_CHALLENGE_ONLY: 'YES'
        run: python python/token_risk_base.py

  docs-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node -e "const x=require('./examples/payment-required.json'); if(x.x402Version!==2 || !x.accepts.some(p=>p.network==='eip155:8453') || !x.accepts.some(p=>String(p.network).startsWith('solana:'))) process.exit(1); console.log('PASS dual-network challenge sample')"
