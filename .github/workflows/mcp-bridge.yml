name: MCP Bridge

on:
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-bridge.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify npm package contents
        run: npm run pack:check
      - name: Validate MCPB manifest for current Smithery stdio distribution
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - name: Install MCP Registry publisher validator
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Validate official MCP Registry metadata
        run: ./mcp-publisher validate server.json

  windows-stdio:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse Windows Hermes helper with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\install-hermes-windows.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: Run MCP tests on Windows
        run: npm test
