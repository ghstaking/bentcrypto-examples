name: MCP Bridge

on:
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-bridge.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
